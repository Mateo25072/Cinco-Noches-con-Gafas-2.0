name: Build exe and apk
on:
  workflow_dispatch:
    inputs:
      commit_to_repo:
        description: "Guardar el .exe y el .apk en artifacts/ de main"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run desktop:dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: artifacts/windows/*.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install --no-audit --no-fund
      - run: npm run android:sync
      - run: npm run check:android
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  publish:
    needs: [windows, android]
    if: ${{ inputs.commit_to_repo }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: false, ref: main }
      - uses: actions/download-artifact@v4
        with: { name: windows-exe, path: new-exe }
      - uses: actions/download-artifact@v4
        with: { name: android-apk, path: new-apk }
      - run: |
          git lfs install --local
          cp new-exe/*.exe "artifacts/windows/"
          cp new-apk/app-debug.apk artifacts/android/Cinco-Noches-con-Gafas-debug.apk
          rm -rf new-exe new-apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/windows/*.exe artifacts/android/Cinco-Noches-con-Gafas-debug.apk
          git commit -m "Update Windows exe and Android apk (menu GIF)"
          git push origin main
