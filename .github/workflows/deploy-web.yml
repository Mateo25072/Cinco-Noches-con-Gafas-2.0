name: Deploy web (GitHub Pages)
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { lfs: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run build:android:web
        env:
          VITE_HASH_ROUTER: "1"
      - name: Rutas relativas para la subcarpeta de Pages
        run: |
          node scripts/web-relative-paths.mjs dist-android
          touch dist-android/.nojekyll
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist-android }
      - id: deployment
        uses: actions/deploy-pages@v4
